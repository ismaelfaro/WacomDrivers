name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test (protocol parsing, docs in sync with code)
        run: swift test
      - name: llms-full.txt is up to date
        run: |
          ./scripts/make-llms-full.sh
          git diff --exit-code llms-full.txt
